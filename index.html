<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AuditIQ — Continuous Audit Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* ---------- Theme tokens (light default, dark via viewer setting or toggle) ---------- */
  :root{
    color-scheme:light;
    --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F0F3F7; --border:#D8DFE7; --border-soft:#E7EBF0;
    --text-primary:#14202B; --text-secondary:#4E6072; --text-muted:#7A8B9C;
    --teal:#0E8C72; --teal-dim:#DCF2EB; --amber:#98630A; --amber-dim:#FAEFD6;
    --coral:#C13B26; --coral-dim:#FBE2DD; --blue:#2C5FCF; --blue-dim:#E0E9FB;
    --on-coral:#FFFFFF;
    --inc-fg:#2C5FCF; --sr-bg:#E1F1E5; --sr-fg:#2F7A43; --cr-fg:#98630A;
    --font-serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
    --font-sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0F1720; --panel:#141F29; --panel-2:#182531; --border:#26333F; --border-soft:#1D2933;
      --text-primary:#E8EEF3; --text-secondary:#8FA3B3; --text-muted:#5E7183;
      --teal:#2FBF9F; --teal-dim:#173A34; --amber:#E0A030; --amber-dim:#3A2E14;
      --coral:#E0604A; --coral-dim:#3A1E17; --blue:#5B8DEF; --blue-dim:#182A44;
      --on-coral:#1A0D0A;
      --inc-fg:#9BBBF7; --sr-bg:#1E2E22; --sr-fg:#8FCB9D; --cr-fg:#F0C575;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1720; --panel:#141F29; --panel-2:#182531; --border:#26333F; --border-soft:#1D2933;
    --text-primary:#E8EEF3; --text-secondary:#8FA3B3; --text-muted:#5E7183;
    --teal:#2FBF9F; --teal-dim:#173A34; --amber:#E0A030; --amber-dim:#3A2E14;
    --coral:#E0604A; --coral-dim:#3A1E17; --blue:#5B8DEF; --blue-dim:#182A44;
    --on-coral:#1A0D0A;
    --inc-fg:#9BBBF7; --sr-bg:#1E2E22; --sr-fg:#8FCB9D; --cr-fg:#F0C575;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text-primary); font-family:var(--font-sans); font-size:14px; line-height:1.5; min-height:100vh;}
  h1,h2,h3,h4,p{margin:0;}
  button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer;}
  .mono{font-family:var(--font-mono);}
  .muted{color:var(--text-secondary);}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Shell ---------- */
  .shell{display:grid; grid-template-columns:244px minmax(0,1fr); min-height:100vh;}
  .sidebar{position:sticky; top:env(safe-area-inset-top,0px); align-self:start; height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column;}
  .brand{padding:0 8px 4px;}
  .brand h1{font-family:var(--font-serif); font-weight:600; font-size:25px; letter-spacing:.2px; display:flex; align-items:center; gap:9px;}
  .brand h1 i{width:9px; height:9px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px var(--teal-dim); display:inline-block;}
  .brand small{display:block; margin-top:2px; font-size:12px; color:var(--text-secondary);}
  .mode-pill{margin:14px 8px 18px; font-size:11px; color:var(--amber); background:var(--amber-dim); padding:4px 9px; align-self:flex-start; font-family:var(--font-mono);}
  .nav-title{font-size:11px; letter-spacing:.09em; color:var(--text-muted); padding:0 10px 8px;}
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; border-left:2px solid transparent; padding:9px 10px; color:var(--text-secondary);}
  .nav-item:hover{background:var(--panel-2); color:var(--text-primary);}
  .nav-item.active{background:var(--blue-dim); color:var(--text-primary); border-left-color:var(--blue);}
  .nav-icon{width:18px; text-align:center; opacity:.85;}
  .nav-badge{margin-left:auto; font-family:var(--font-mono); font-size:11px; background:var(--amber-dim); color:var(--amber); padding:0 6px;}
  .sidebar-foot{margin-top:auto; padding:18px 8px 0; font-size:12px; color:var(--text-secondary);}
  .sidebar-foot .ver{margin-top:6px; color:var(--text-muted); font-size:11px;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px var(--teal-dim); display:inline-block; margin-right:8px;}
  .dot.off{background:var(--text-muted); box-shadow:0 0 0 3px var(--border-soft);}

  .main{min-width:0;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; padding:24px 28px 16px; border-bottom:1px solid var(--border);}
  .eyebrow{font-size:11px; letter-spacing:.09em; color:var(--text-muted); text-transform:uppercase;}
  .topbar h2{font-family:var(--font-serif); font-weight:600; font-size:27px; margin-top:2px;}
  .top-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .live-pill{display:flex; align-items:center; background:none; border:1px solid var(--border); padding:6px 11px; font-size:12px; color:var(--text-secondary);}
  .live-pill:hover{background:var(--panel-2);}
  .user{display:flex; align-items:center; gap:10px; font-size:12px;}
  .user strong{display:block; font-weight:500; font-size:13px;}
  .user span{color:var(--text-secondary);}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--blue-dim); color:var(--blue); display:grid; place-items:center; font-weight:600; font-size:12px;}
  .content{padding:24px 28px 56px; max-width:1360px;}
  .stack{display:flex; flex-direction:column; gap:22px;}

  /* ---------- Generic pieces ---------- */
  .btn{background:var(--panel-2); border:1px solid var(--border); padding:7px 13px; color:var(--text-primary);}
  .btn:hover{border-color:var(--text-muted);}
  .btn.primary{background:var(--blue); border-color:var(--blue); color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.sm{padding:4px 10px; font-size:12px;}
  .link{background:none; border:0; padding:0; color:var(--blue); font-family:var(--font-mono); font-size:13px; text-decoration:none;}
  .link:hover{text-decoration:underline;}
  .link.sm{font-family:var(--font-sans); font-size:12px; margin-top:6px;}
  .card,.panel{background:var(--panel); border:1px solid var(--border);}
  .card{padding:18px 20px;}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px;}
  .card h3,.section-head h3{font-family:var(--font-serif); font-weight:600; font-size:18px;}
  .card-head p{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .pill{display:inline-block; font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; padding:3px 9px;}
  .pill.blue{background:var(--blue-dim); color:var(--blue);}
  .pill.purple{background:var(--blue-dim); color:var(--blue);}
  .pill.gold{background:var(--amber-dim); color:var(--amber);}
  .pill.green{background:var(--teal-dim); color:var(--teal);}
  .tag{display:inline-block; font-family:var(--font-mono); font-size:11px; padding:2px 8px; letter-spacing:.02em; white-space:nowrap;}
  .tag.pass,.tag.low{background:var(--teal-dim); color:var(--teal);}
  .tag.review,.tag.high{background:var(--amber-dim); color:var(--amber);}
  .tag.fail{background:var(--coral-dim); color:var(--coral);}
  .tag.medium{background:var(--blue-dim); color:var(--blue);}
  .tag.critical{background:var(--coral); color:var(--on-coral);}
  .type-badge,.type-chip{font-size:11px; padding:2px 7px; text-align:center; font-family:var(--font-mono); display:inline-block;}
  .type-inc{background:var(--blue-dim); color:var(--inc-fg);}
  .type-sr{background:var(--sr-bg); color:var(--sr-fg);}
  .type-cr{background:var(--amber-dim); color:var(--cr-fg);}
  .type-chip.large{font-size:13px; padding:3px 10px;}
  .empty{padding:18px; text-align:center; color:var(--text-secondary); font-size:13px; border:1px dashed var(--border);}
  .section-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .section-head small{color:var(--text-secondary); font-size:12px;}
  .page-intro{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;}
  .page-intro h2{font-family:var(--font-serif); font-size:24px; font-weight:600; margin:8px 0 4px; max-width:720px;}
  .page-intro p{color:var(--text-secondary); max-width:720px;}
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-weight:500; font-size:12px; color:var(--text-secondary); padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:11px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  td small{display:block; color:var(--text-secondary); font-size:12px;}
  tbody tr:hover{background:var(--panel-2);}
  .table-card{padding:0;}
  .table-card .card-head{padding:16px 20px 0;}

  /* ---------- KPIs ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  .kpi-row + .kpi-row{margin-top:-1px;}
  .kpi{background:var(--panel); padding:16px 18px;}
  .kpi .label{font-size:12px; color:var(--text-secondary); margin-bottom:8px;}
  .kpi .value{font-family:var(--font-serif); font-size:28px; font-weight:600;}
  .kpi .value small{font-family:var(--font-sans); font-size:14px; color:var(--text-secondary); font-weight:400; margin-left:4px;}
  .kpi .delta{font-size:12px; margin-top:6px; color:var(--teal);}
  .kpi .delta.warn{color:var(--amber);}
  .kpi .delta.mute{color:var(--text-muted);}

  /* ---------- Dashboard ---------- */
  .hero{display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; padding:24px 26px; background:linear-gradient(120deg,var(--blue-dim),var(--panel) 70%); border:1px solid var(--border);}
  .hero h2{font-family:var(--font-serif); font-size:25px; font-weight:600; margin:10px 0 6px; max-width:620px;}
  .hero p{color:var(--text-secondary); max-width:600px;}
  .flow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px;}
  .flow span{background:var(--panel); border:1px solid var(--border); padding:6px 11px;}
  .flow b{color:var(--text-muted); font-weight:400;}
  .chart-wrap{padding:0;}
  .canvas-box{position:relative; height:230px;}
  .legend{display:flex; gap:16px; margin-top:12px; font-size:11px; color:var(--text-secondary); flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .sw{width:9px; height:9px; display:inline-block;}
  .alert-row{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--border-soft); cursor:pointer;}
  .alert-row:first-of-type{border-top:0;}
  .alert-row:hover{background:var(--panel-2);}
  .alert-icon{width:26px; height:26px; flex:0 0 26px; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:13px; background:var(--amber-dim); color:var(--amber);}
  .alert-icon.critical,.alert-icon.fail{background:var(--coral-dim); color:var(--coral);}
  .alert-main{flex:1; min-width:0;}
  .alert-main strong{font-family:var(--font-mono); font-size:13px; margin-right:8px;}
  .alert-main p{font-size:13px; color:var(--text-secondary); margin-top:3px;}
  .alert-main small{color:var(--text-muted); font-size:11px;}
  .chev{color:var(--text-muted); font-size:18px;}
  .lifecycle{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .life-step{display:flex; gap:10px; align-items:center; padding:9px 11px; background:var(--panel-2);}
  .life-step > span{font-family:var(--font-mono); font-size:12px; color:var(--blue);}
  .life-step strong{display:block; font-size:13px; font-weight:500;}
  .life-step small{color:var(--text-secondary); font-size:11px;}
  .before-after{display:grid; grid-template-columns:1fr 1px 1fr; gap:24px;}
  .before-after label{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--text-muted); display:block; margin-bottom:8px;}
  .before-after .after label{color:var(--teal);}
  .ba-divider{background:var(--border);}
  .ba-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; flex-wrap:wrap;}
  .ba-row b{color:var(--text-muted); font-weight:400;}
  .ba-row span{background:var(--panel-2); padding:4px 10px;}

  /* ---------- Monitoring ---------- */
  .monitor-badge{display:flex; align-items:center; font-size:12px; color:var(--teal); border:1px solid var(--border); padding:6px 12px; background:var(--panel);}
  .monitor-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px;}
  .monitor-card{background:var(--panel); border:1px solid var(--border); padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
  .monitor-top{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-muted);}
  .monitor-card h3{font-family:var(--font-mono); font-size:16px; font-weight:500;}
  .monitor-card p{font-size:13px; color:var(--text-secondary);}
  .action-box{background:var(--panel-2); border-left:2px solid var(--blue); padding:8px 11px; margin-top:auto;}
  .action-box span{display:block; font-size:11px; color:var(--text-muted);}
  .action-box strong{font-weight:500; font-size:13px;}
  .proactive{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; font-size:12px;}
  .proactive span{background:var(--panel-2); padding:6px 11px;}
  .proactive b{color:var(--text-muted); font-weight:400;}
  .main-grid{display:grid; grid-template-columns:1.15fr 1fr; gap:20px; align-items:start;}
  .panel-head{padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px; color:var(--text-secondary); display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .stream{max-height:520px; overflow-y:auto;}
  .row{display:grid; grid-template-columns:96px 46px 1fr 40px 66px; gap:10px; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border-soft); cursor:pointer; font-size:13px;}
  .row:hover{background:var(--panel-2);}
  .row.selected{background:var(--blue-dim); border-left:2px solid var(--blue); padding-left:14px;}
  .row .id{font-family:var(--font-mono); font-size:12px; color:var(--text-secondary);}
  .row .cat{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .score{font-family:var(--font-mono); text-align:right;}
  .status-chip{font-size:11px; padding:3px 6px; text-align:center; font-family:var(--font-mono);}
  .status-pass{background:var(--teal-dim); color:var(--teal);}
  .status-review{background:var(--amber-dim); color:var(--amber);}
  .status-fail{background:var(--coral-dim); color:var(--coral);}
  .detail{padding:16px;}
  .detail-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:12px;}
  .detail-header .id{font-family:var(--font-mono); font-size:13px; color:var(--text-secondary);}
  .detail-header .cat{font-size:16px; margin-top:4px;}
  .score-big{font-family:var(--font-serif); font-size:34px; font-weight:600; text-align:right; line-height:1.1;}
  .score-big small{display:block; font-family:var(--font-sans); font-size:11px; color:var(--text-secondary); font-weight:400;}
  .checklist{border-top:1px solid var(--border-soft); padding-top:8px;}
  .check-item{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border-soft);}
  .check-item:last-child{border-bottom:none;}
  .check-icon{width:18px; height:18px; flex:0 0 18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--font-mono); margin-top:1px;}
  .icon-pass{background:var(--teal-dim); color:var(--teal);}
  .icon-review{background:var(--amber-dim); color:var(--amber);}
  .icon-fail{background:var(--coral-dim); color:var(--coral);}
  .check-text .name{font-size:13px; margin-bottom:2px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .check-text .name em{font-style:normal; font-family:var(--font-mono); font-size:11px; color:var(--text-muted);}
  .check-text .rationale{font-size:12px; color:var(--text-secondary); line-height:1.5;}
  .consistency-note{margin-top:14px; padding:12px 14px; background:var(--panel-2); border-left:2px solid var(--blue); font-size:12px; color:var(--text-secondary); line-height:1.6;}
  .consistency-note b{color:var(--text-primary); font-weight:500;}
  .detail-foot{margin-top:14px; display:flex; justify-content:flex-end;}

  /* ---------- Queue ---------- */
  .filterbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--text-secondary);}
  .filter{background:var(--panel); border:1px solid var(--border); padding:5px 12px; font-size:12px; color:var(--text-secondary);}
  .filter.active{background:var(--blue-dim); border-color:var(--blue); color:var(--text-primary);}
  .filter-spacer{flex:1;}
  .risk-num{font-family:var(--font-mono); margin-right:8px;}
  .icon-button{background:none; border:1px solid var(--border); width:28px; height:28px; color:var(--text-secondary);}
  .icon-button:hover{background:var(--panel-2);}
  .state{font-size:12px; color:var(--text-secondary);}

  /* ---------- Ticket detail ---------- */
  .detail-top{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; flex-wrap:wrap;}
  .detail-title{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:10px 0 4px;}
  .detail-title h3{font-family:var(--font-mono); font-size:24px; font-weight:500;}
  .detail-top p{color:var(--text-secondary);}
  .detail-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .detail-actions select{max-width:230px;}
  select,input[type=text],input[type=number],input:not([type]){background:var(--panel-2); color:var(--text-primary); border:1px solid var(--border); padding:7px 10px; font-family:inherit; font-size:13px; min-width:0;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}
  .runbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--panel); border:1px solid var(--border); font-size:12px; margin-top:16px;}
  .runbar b{color:var(--text-muted); font-weight:400;}
  .rstep{padding:4px 10px; background:var(--panel-2); color:var(--text-muted); transition:all .25s;}
  .rstep.on{background:var(--teal-dim); color:var(--teal);}
  .detail-grid{display:grid; grid-template-columns:300px 1fr; gap:20px;}
  .ring{width:136px; height:136px; border-radius:50%; display:grid; place-items:center; margin:4px auto 16px;}
  .ring > div{width:108px; height:108px; border-radius:50%; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring strong{font-family:var(--font-serif); font-size:32px; line-height:1;}
  .ring span{font-size:11px; color:var(--text-secondary); margin-top:3px;}
  .mini-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border);}
  .mini-stats div{background:var(--panel); padding:9px 10px; text-align:center;}
  .mini-stats span{display:block; font-size:11px; color:var(--text-secondary);}
  .mini-stats strong{font-size:13px; font-weight:500;}
  .finding{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-soft);}
  .finding:last-child{border-bottom:0;}
  .finding-icon{width:22px; height:22px; flex:0 0 22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; margin-top:1px;}
  .finding-icon.pass{background:var(--teal-dim); color:var(--teal);}
  .finding-icon.review{background:var(--amber-dim); color:var(--amber);}
  .finding-icon.fail{background:var(--coral-dim); color:var(--coral);}
  .finding-body{flex:1; min-width:0;}

  const c = cons(t), id = `<b>${esc(t.id)}</b>`;
  if(c.d === 'PASS') return `${id} matches a pattern both historical auditors scored the same way ${c.pct}% of the time — resolved automatically, no review needed.`;
  if(c.d === 'REVIEW') return `${id} falls in AuditIQ's low-confidence band. Historically, Auditor A and Auditor B disagreed on ${c.pct}% of tickets like this one — it has been routed to the review workbench rather than auto-scored.`;
  return `${id} has a control failure detected with high AI confidence. Historical auditors reached the same FAIL outcome on ${c.pct}% of similar tickets — flagged for confirmation and remediation, never auto-closed.`;
}

/* ---------- ticket generation (live stream) ---------- */
function genTicket(time, force){
  const type = pick(['INC','INC','SR','SR','CR']);
  const category = pick(CATS[type]);
  const rules = RULES[type];
  const forceIdx = force ? Math.floor(Math.random()*rules.length) : -1;
  const ev = {};
  rules.forEach(([name,,method], i) => {
    let status;
    if(i === forceIdx) status = force;
    else { const roll = Math.random(); status = roll < 0.955 ? 'PASS' : roll < 0.985 ? 'REVIEW' : 'FAIL'; }
    const [source, passText] = META[name];
    let text, confidence;
    if(status === 'PASS'){ text = passText; confidence = method==='ai' ? ri(88,97) : ri(96,99); }
    else if(status === 'REVIEW'){ text = pick(R_REVIEW); confidence = ri(66,79); }
    else { text = pick(R_FAIL); confidence = ri(90,98); }
    ev[name] = {status, confidence, source, text};
  });
  const vals = Object.values(ev);
  const passN = vals.filter(v => v.status==='PASS').length;
  const hasFail = vals.some(v => v.status==='FAIL'), hasReview = vals.some(v => v.status==='REVIEW');
  const score = clamp(Math.round(passN/rules.length*100 - (hasFail ? rand(5,15) : 0) - (hasReview ? rand(0,5) : 0)), 35, 99);
  const risk = clamp(Math.round(100 - score + (hasFail ? 10 : 0) + rand(0,8)), 5, 95);
  const st = n => ev[n] && ev[n].status;
  const flag = n => st(n)==='PASS' ? true : st(n)==='REVIEW' ? 'partial' : false;
  const flags = type !== 'CR' ? {} : {businessApproval:st('Business approval')==='PASS', technicalApproval:st('Technical approval')==='PASS', rollbackPlan:flag('Rollback plan'), testing:st('Testing')==='PASS', riskAssessment:st('Risk assessment')==='PASS', implementationPlan:st('Implementation plan')==='PASS', postValidation:st('Post-implementation review')==='PASS'};
  const id = PREF[type] + (seq[type]++);
  return {
    id, type, shortDescription:category, category, priority:pick(['P2','P3','P3','P4']), assignmentGroup:pick(GROUPS[type]), owner:pick(['L1 Support','L2 Support','Platform Operations','Workplace Services']),
    state:'Closed', risk, compliance:score, confidence:Math.round(vals.reduce((s,v) => s+v.confidence, 0)/vals.length),
    sla: st('SLA')==='FAIL' ? 'Breached' : 'Met', target:'Closed', flags, businessOwner:'Service Owner',
    description:`Closed ${type==='INC'?'incident':type==='SR'?'service request':'change'}: ${category.toLowerCase()}.`,
    workNotes:NOTES[type].slice(0, 2), approvals:[], evidence:ev, trail:[], time:time || new Date(), flaggedAt:(hasFail||hasReview) ? (time||new Date()).getTime() : undefined
  };
}

/* ---------- actions ported from the FastAPI backend ---------- */
function resolveApproval(t){
  t.flags.businessApproval = true;
  t.approvals = [...new Set([...t.approvals, `Business owner approval — ${t.businessOwner}`])];
  t.evidence['Business approval'] = {status:'PASS', confidence:99, source:'Approval records', text:'Business owner approval received and timestamped before implementation.'};
  t.risk = Math.max(5, t.risk - 21);
  t.compliance = Math.min(100, t.compliance + 29);
  t.confidence = Math.max(t.confidence, 97);
}
function applyOverride(t, crit, dec, note){
  const e = t.evidence[crit], from = e.status;
  e.status = dec; e.overridden = true; e.reason = `Human override by ${AUDITOR}: ${note}`;
  if(dec === 'PASS') t.compliance = Math.min(100, t.compliance + 6);
  t.trail.unshift({who:AUDITOR, criterion:crit, from, to:dec, note, when:new Date()});
}

/* ---------- stats ---------- */
function stats(){
  const c = tickets.filter(t => t.state === 'Closed'), n = c.length;
  const pass = c.filter(t => decision(t) === 'PASS').length;
  const hi = t => ['CRITICAL','HIGH'].includes(band(t));
  return {
    n, pass, flagged:n-pass, avg:n ? Math.round(c.reduce((s,t) => s+t.compliance, 0)/n) : 0, auto:n ? Math.round(pass/n*100) : 0,
    high:tickets.filter(hi).length, alerts:tickets.filter(t => t.state!=='Closed' && decision(t)!=='PASS' && hi(t)).length,
    attention:tickets.filter(t => decision(t) !== 'PASS').length
  };
}
function alertList(){
  const mk = (t, open) => {
    const f = findings(t).filter(x => x.status !== 'PASS').sort((a,b) => (a.status==='FAIL'?0:1) - (b.status==='FAIL'?0:1));
    const b = band(t);
    return {id:t.id, status: open ? (b==='CRITICAL'||b==='HIGH' ? b : 'REVIEW') : decision(t), message:f.slice(0,2).map(x => x.reason).join(' '), action:ACTION[f[0].criterion] || 'Auditor review', time:rel(t.flaggedAt || t.time.getTime())};
  };
  const open = tickets.filter(t => t.state!=='Closed' && decision(t)!=='PASS').sort((a,b) => b.risk-a.risk).map(t => mk(t,true));
  const closed = tickets.filter(t => t.state==='Closed' && decision(t)!=='PASS').sort((a,b) => b.time-a.time).slice(0,3).map(t => mk(t,false));
  return open.concat(closed);
}

/* ---------- copilot ---------- */
const COPILOT_SOURCES = ['Audit Rules','Ticket Evidence','Historical Audit Patterns'];
const SUGGESTIONS = ['Why did this ticket fail?','What evidence supports this finding?','Show me all tickets missing approval.','Which audit rules caused the score to drop?','Find similar tickets','Would human auditors agree?','Give me a summary for management.'];
function copilotAnswer(t, question){
  const q = question.toLowerCase();
  const fl = findings(t).filter(x => x.status !== 'PASS');
  if(/(all|which|list|show).*(ticket).*(approval)|missing approval|without approval/.test(q)){
    const hits = tickets.filter(x => ['Business approval','Technical approval','Authorization'].some(c => x.evidence[c] && x.evidence[c].status !== 'PASS')).sort((a,b) => b.risk-a.risk);
    if(!hits.length) return ['No tickets currently have a missing or unconfirmed approval.'];
    return [`${hits.length} ticket${hits.length>1?'s have':' has'} a missing or unconfirmed approval. Highest risk first:`, ...hits.slice(0,6).map(x => `• ${x.id} (${x.type}, ${band(x)} risk, ${x.state}) — ${x.shortDescription}`), hits.length>6 ? `…and ${hits.length-6} more in the Audit Queue.` : ''].filter(Boolean);
  }
  if(q.includes('why') && (q.includes('fail') || q.includes('risk'))){
    if(!fl.length) return [`${t.id} has no failing criteria. All ${RULES[t.type].length} evaluated criteria pass, with CAFÉ score ${t.compliance} and ${band(t)} risk.`];
    return [`${t.id} is currently ${band(t)} risk with a CAFÉ score of ${t.compliance}.`, ...fl.map(f => `• ${f.criterion} (${f.status}, ${f.confidence}% confidence): ${f.reason}`)];
  }
  if(q.includes('evidence')){
    if(!fl.length) return [`All available evidence for ${t.id} is passing — ${RULES[t.type].length} criteria checked against ticket fields, work notes and approval records.`];
    return [`Relevant non-pass evidence for ${t.id}:`, ...fl.map(f => { const e = t.evidence[f.criterion]; return `• ${f.criterion} — ${e.text} Source: ${e.source} (${e.confidence}% confidence).`; })];
  }
  if(q.includes('similar')){
    const crit = fl.map(f => f.criterion);
    const hits = tickets.filter(x => x.id !== t.id && x.type === t.type && (crit.length ? findings(x).some(f => f.status !== 'PASS' && crit.includes(f.criterion)) : decision(x) === 'PASS')).slice(0,4);
    if(!hits.length) return [`No comparable ${t.type} tickets found in the current dataset yet.`];
    return [`Closest comparators to ${t.id} (same ticket type${crit.length ? ', overlapping failed criteria' : ''}):`, ...hits.map(x => `• ${x.id} — ${x.shortDescription} · ${decision(x)}${crit.length ? ' · ' + findings(x).filter(f => f.status !== 'PASS' && crit.includes(f.criterion)).map(f => f.criterion).join(', ') : ''}`), 'Historically, these patterns most often involve missing approval, rollback or validation evidence.'];
  }
  if(q.includes('rule') || q.includes('score') || q.includes('drop')){
    if(!fl.length) return [`No rules are reducing the score for ${t.id}. Risk is ${t.risk}/100 and SLA is ${t.sla.toLowerCase()}.`];
    return [`Score drivers for ${t.id}:`, ...fl.map(f => `• ${f.criterion} — ${f.method==='ai' ? 'AI reasoning' : 'Rule engine'} (${f.severity} severity)`), `Combined with risk ${t.risk}/100 and SLA status “${t.sla}”, this gives CAFÉ score ${t.compliance}.`];
  }
  if(q.includes('agree') || q.includes('auditor') || q.includes('consisten') || q.includes('human')){
    const c = cons(t);
    return [c.d === 'PASS' ? `Yes — both historical auditors scored tickets matching this pattern the same way ${c.pct}% of the time, so ${t.id} was resolved automatically.` : c.d === 'REVIEW' ? `Possibly not. Historical auditors disagreed on ${c.pct}% of tickets like ${t.id}, which is why it is routed to human review rather than auto-scored.` : `Very likely. Historical auditors reached the same FAIL outcome on ${c.pct}% of similar tickets; ${t.id} is flagged for confirmation and remediation.`];
  }
  if(q.includes('summary') || q.includes('management')){
    return [`Management summary: ${t.id} (${t.type}) is ${band(t)} risk with a CAFÉ score of ${t.compliance} and ${fl.filter(f => f.status!=='PASS').length} open finding(s). Decision: ${decision(t)}.`, fl.length ? `Recommended action: ${ACTION[fl[0].criterion] || 'auditor review'}.` : 'No action required.'];
  }
  return ['I can explain findings, show evidence, compare similar tickets, identify score drivers, list tickets missing approval, or write a management summary.'];
}

function runAudit(){
  const t = byId(S.selected), bar = $('#runbar');
  if(!t || !bar || S.running) return;
  S.running = true;
  const steps = ['Ticket Intelligence','Evidence Extraction','Audit Rules','AI Reasoning','Risk Scoring'];
  bar.innerHTML = `<div class="runbar">${steps.map((s,i) => `<span class="rstep" data-i="${i}">${s}</span>`).join('<b>→</b>')}</div>`;
  steps.forEach((s,i) => setTimeout(() => { const n = bar.querySelector(`[data-i="${i}"]`); if(n) n.classList.add('on'); }, 330*(i+1)));
  setTimeout(() => { S.running = false; toast(`Audit re-evaluated — ${decision(t)}, CAFÉ score ${t.compliance}, risk ${t.risk}/100.`); if(S.page==='detail' && S.selected===t.id) render(); }, 330*(steps.length+1)+120);
}
function ask(q){
  q = (q || '').trim(); if(!q || S.pending) return;
  const t = byId(S.cpTicket);
  S.chat.push({role:'user', text:q}); S.pending = true; render();
  setTimeout(() => { S.chat.push({role:'ai', lines:copilotAnswer(t, q)}); S.pending = false; if(S.page === 'copilot') render(); }, 520);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case 'nav': go(el.dataset.page); break;
    case 'open': S.selected = id; S.tab = 'findings'; S.overrideOpen = null; S.page = 'detail'; render(); window.scrollTo(0,0); break;
    case 'streamSel': S.streamSel = id; $('#stream').innerHTML = streamHTML(); $('#streamDetail').innerHTML = streamDetailHTML(); $('#detailTime').textContent = timeStr(byId(id).time); break;
    case 'pause': S.paused = !S.paused; updateChrome(); { const b = $('#streamPause'); if(b) b.textContent = S.paused ? '▶ Resume stream' : '❚❚ Pause stream'; } break;
    case 'theme': document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; render(); break;
    case 'filter': S.queueFilter = id; render(); break;
    case 'tab': S.tab = id; render(); break;
    case 'approve': { const t = byId(S.selected); resolveApproval(t); toast(`Business approval received — ${t.id} is now ${band(t)} risk, CAFÉ score ${t.compliance}.`); render(); break; }
    case 'rerun': runAudit(); break;
    case 'ovOpen': S.overrideOpen = S.overrideOpen === id ? null : id; render(); break;

      toast('Override recorded — written to the audit trail and feedback store.'); render(); break;

    case 'cpSug': ask(el.dataset.q); break;
    case 'cpAsk': { const i = $('#cpInput'); const v = i.value; i.value = ''; ask(v); break; }

  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if(!el) return;
  const k = el.dataset.change;
  if(k === 'selectTicket'){ S.selected = el.value; S.tab = 'findings'; S.overrideOpen = null; render(); }
  else if(k === 'cpTicket'){ S.cpTicket = el.value; render(); }
  else if(k === 'cfg'){
    const key = el.dataset.key; let v = clamp(Number(el.value) || 0, 0, 100);
    if(key === 'critical' && v <= CFG.high) v = Math.min(100, CFG.high + 1);
    if(key === 'high' && v >= CFG.critical) v = Math.max(MEDIUM + 1, CFG.critical - 1);
    if(key === 'high' && v <= MEDIUM) v = MEDIUM + 1;
    CFG[key] = v;
    if(key === 'critical' || key === 'high') toast('Risk thresholds applied — every ticket band recalculated.'); else toast('Setting saved for this demo session.');
    render();
  }
});

})();
